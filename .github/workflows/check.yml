name: Validate website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno install --frozen
      - run: deno task check
      - run: deno task resource:check
      - run: deno task test
      # No ASSET_BASE_URL is set here on purpose: the production build must fail loudly rather
      # than ship a site that silently omits resource previews. Once the first hosted resource
      # exists, set ASSET_BASE_URL for this step (an empty value still fails URL validation).
      - run: deno task build
