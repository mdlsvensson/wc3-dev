name: Validate website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno install --frozen
      - run: deno task check
      - run: deno task resource:check
      - run: deno task test
      - run: deno task build
